name: Build xdBot

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Apply port patches
        shell: bash
        run: for f in port*.py; do python3 "$f" || python "$f"; done

      - name: Build
        uses: geode-sdk/build-geode-mod@main
        with:
          export-pdb: true
          combine: true
          sdk: "v6.0.0-beta.1"
          target: ${{ matrix.config.target }}
          ccache-variant: ccache
          build-config: Release

      - name: Collect all compile errors
        if: failure() && runner.os == 'Linux'
        run: |
          cmake --build build -- -k 0 2>&1 | grep -E "error:" | sed 's#/home/runner/work/xdBot/xdBot/##' | sort -u | head -3000 > all-errors.txt || true
          wc -l all-errors.txt

      - name: Upload errors
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: all-errors
          path: all-errors.txt

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ !cancelled() }}

    steps:
      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main
        with:
          zstd: true
          optimize-pngs: true
        id: build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
